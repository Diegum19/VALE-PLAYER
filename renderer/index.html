<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' http: https: data:; media-src 'self' http: https: blob:; connect-src 'self' http: https: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vela Player</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="toast" role="status" aria-live="polite"></div>

<main id="login" class="screen">
  <form id="loginForm" class="login-card" autocomplete="off">
    <div class="logo">⛵</div>
    <h1>Vela Player</h1>
    <p class="sub">Entre com os dados do seu serviço.</p>
    <div id="picker" class="hidden"></div>
    <div id="newFields">
    <label>Host<input id="host" placeholder="http://servidor.com:8080" spellcheck="false" required></label>
    <label>Usuário<input id="user" spellcheck="false" required></label>
    <label>Senha<input id="pass" type="password" required></label>
    <label class="check"><input id="remember" type="checkbox" checked> Lembrar neste computador</label>
    <button id="loginBtn" class="primary" type="submit">Entrar</button>
    </div>
    <p id="loginErr" class="err" role="alert"></p>
  </form>
</main>

<div id="app" class="screen hidden">
  <aside id="side">
    <div class="brand"><span data-icon="sailboat"></span><span>Vela</span></div>
    <nav id="nav">
      <button data-tab="home" class="focusable"><span class="nav-icon" data-icon="home"></span><span>Início</span></button>
      <button data-tab="live" class="focusable"><span class="nav-icon" data-icon="tv"></span><span>TV ao vivo</span></button>
      <button data-tab="movie" class="focusable"><span class="nav-icon" data-icon="film"></span><span>Filmes</span></button>
      <button data-tab="series" class="focusable"><span class="nav-icon" data-icon="clapperboard"></span><span>Séries</span></button>
      <button data-tab="search" class="focusable"><span class="nav-icon" data-icon="search"></span><span>Busca geral</span></button>
      <button data-tab="favs" class="focusable"><span class="nav-icon" data-icon="star"></span><span>Favoritos</span></button>
      <button data-tab="history" class="focusable"><span class="nav-icon" data-icon="history"></span><span>Histórico</span></button>
    </nav>
    <div class="grow"></div>
    <div id="acct" class="acct"></div>
    <button id="settingsBtn" class="ghost focusable"><span data-icon="settings"></span><span>Configurações</span></button>
    <button id="logout" class="ghost focusable"><span data-icon="users"></span><span>Trocar perfil</span></button>
  </aside>
  <section id="content">
    <header>
      <input id="search" type="search" placeholder="Pesquisar nesta categoria…" class="focusable">
      <select id="sort" class="focusable hidden"><option value="">Ordem do servidor</option><option value="az">A–Z</option><option value="recent">Mais recentes</option><option value="rating">Melhor avaliação</option></select>
      <span id="count" class="muted"></span>
    </header>
    <div class="body">
      <div id="cats"></div>
      <div id="gridWrap"><div id="home" class="hidden"></div><div id="grid"></div><div id="state" class="muted"></div></div>
    </div>
  </section>
</div>

<div id="detail" class="overlay hidden" role="dialog" aria-modal="true">
  <div class="sheet">
    <button id="detailClose" class="ghost close focusable" aria-label="Fechar"><span data-icon="close"></span></button>
    <div class="dhead"><img id="dposter" alt=""><div><h2 id="dtitle"></h2><p id="dmeta" class="muted"></p><p id="dplot"></p><p id="dcast" class="muted"></p>
      <div class="row"><button id="dplay" class="primary focusable"><span data-icon="play"></span><span>Assistir</span></button><button id="dfav" class="ghost focusable"><span data-icon="star"></span><span>Favoritar</span></button></div></div></div>
    <div id="seasons"></div>
    <div id="episodes"></div>
  </div>
</div>

<div id="modal" class="overlay hidden" role="dialog" aria-modal="true"><div class="sheet small" id="modalBody"></div></div>

<div id="player" class="hidden">
  <video id="video" playsinline></video><div class="player-vignette" aria-hidden="true"></div>
  <div id="ptop"><button id="pback" class="player-back focusable"><span data-icon="back"></span><span>Voltar</span></button><span id="ptitle"></span><span class="grow"></span><button id="pfav" class="icon-button focusable" aria-label="Adicionar aos favoritos"><span data-icon="star"></span></button></div>
  <div id="pinfo" class="hidden"></div><div id="pnum" class="hidden"></div><div id="pmsg" role="status" aria-live="polite"></div>
  <div id="playerControls" class="player-controls"><div id="seekArea" class="seek-area"><input id="seek" class="seek-slider" type="range" min="0" max="1000" value="0" aria-label="Posição do vídeo"><div class="player-time"><span id="elapsedTime">0:00</span><span id="durationTime">0:00</span></div></div>
    <div id="liveLabel" class="live-label hidden"><span class="live-dot"></span><span data-icon="radio"></span><span>AO VIVO</span></div>
    <div class="player-controls-row"><div class="player-main-actions"><button id="playPause" class="player-action primary focusable" aria-label="Pausar"><span data-icon="pause"></span></button><button id="skipBack" class="player-action focusable" aria-label="Voltar 10 segundos"><span data-icon="skipBack"></span><small>10</small></button><button id="skipForward" class="player-action focusable" aria-label="Avançar 10 segundos"><span data-icon="skipForward"></span><small>10</small></button></div>
      <div class="player-secondary-actions"><label class="volume-control" aria-label="Volume"><span data-icon="volume"></span><input id="volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume"></label><button id="pFullscreen" class="player-action focusable" aria-label="Tela cheia"><span data-icon="fullscreen"></span></button></div></div></div>
</div>

<script src="vendor/hls.min.js"></script>
<script src="vendor/mpegts.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
