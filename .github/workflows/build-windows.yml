name: Gerar instalador Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Testar, compilar e publicar instalador
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar dependências do projeto
        run: npm install --no-audit --no-fund

      - name: Executar testes
        run: npm test

      - name: Configurar Python para testes de interface
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Playwright
        run: python -m pip install --upgrade pip playwright

      - name: Instalar Chromium de teste
        run: python -m playwright install chromium

      - name: Preparar bibliotecas de reprodução
        run: npm run vendor

      - name: Gerar vídeo WebM de teste
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ffmpeg = (node -e "process.stdout.write(require('ffmpeg-static'))").Trim()
          if (-not (Test-Path $ffmpeg)) { throw "FFmpeg estático não foi encontrado: $ffmpeg" }
          & $ffmpeg -hide_banner -loglevel error -f lavfi -i "color=c=0x101b2b:s=96x54:r=1:d=30" -an -c:v libvpx -deadline realtime -cpu-used 8 -b:v 2k -g 10 -pix_fmt yuv420p -threads 1 -f webm -y test/clip.webm
          if (-not (Test-Path 'test/clip.webm')) { throw 'Não foi possível gerar o vídeo de teste.' }

      - name: Testar interface com Xtream simulado
        run: python test/ui.test.py

      - name: Verificar sintaxe do app
        run: node --check renderer/app.js

      - name: Verificar sintaxe do núcleo
        run: node --check renderer/core.js

      - name: Verificar sintaxe do Electron
        run: node --check main.js

      - name: Verificar script de bibliotecas
        run: node --check scripts/copy-vendor.js

      - name: Gerar instalador EXE
        run: npm run dist

      - name: Conferir artefato final
        shell: pwsh
        run: |
          $installer = Join-Path $env:GITHUB_WORKSPACE 'dist/Instalar-Vela-Player.exe'
          if (-not (Test-Path $installer)) {
            Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'dist') -Recurse | Format-Table FullName, Length
            throw 'O instalador Instalar-Vela-Player.exe não foi gerado.'
          }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash
          "SHA-256: $hash" | Set-Content -Path "$installer.sha256.txt" -Encoding ascii
          Get-Item $installer | Format-List Name, Length
          Write-Host "SHA-256: $hash"

      - name: Publicar instalador para download direto
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Vela Player — build ${{ github.run_number }}
          body: |
            Instalador do Vela Player para Windows 64 bits.

            Este arquivo foi publicado automaticamente após a conclusão dos testes e da compilação.
          target_commitish: ${{ github.sha }}
          files: |
            dist/Instalar-Vela-Player.exe
            dist/Instalar-Vela-Player.exe.sha256.txt
          draft: false
          prerelease: false
          make_latest: true
