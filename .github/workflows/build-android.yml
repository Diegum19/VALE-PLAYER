name: Build APK Android
on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-android:
    name: Testar e compilar APK de teste
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar plataforma Android
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Verificar arquivos e JavaScript embutido
        run: |
          test -f mobile/android/app/src/main/assets/web/index.html
          python - <<'PY'
          import re
          from pathlib import Path
          p = Path("mobile/android/app/src/main/assets/web/index.html")
          scripts = re.findall(r"<script>(.*?)</script>", p.read_text(encoding="utf-8"), re.S)
          assert len(scripts) == 1, "Esperado exatamente um bloco de JavaScript local"
          Path("/tmp/vela-mobile.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/vela-mobile.js
          test -f mobile/android/app/src/main/java/br/velaplayer/mobile/MainActivity.java
          test -f mobile/android/app/src/main/java/br/velaplayer/mobile/PlayerActivity.java
      - name: Compilar APK debug
        working-directory: mobile/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Conferir APK e hash
        run: |
          APK="mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK" | tee "$APK.sha256.txt"
          file "$APK"
          ls -lh "$APK" "$APK.sha256.txt"
      - name: Publicar APK de teste
        uses: actions/upload-artifact@v4
        with:
          name: Vela-Player-Android-1.0.0-debug-APK
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/android/app/build/outputs/apk/debug/app-debug.apk.sha256.txt
          if-no-files-found: error
          retention-days: 30
